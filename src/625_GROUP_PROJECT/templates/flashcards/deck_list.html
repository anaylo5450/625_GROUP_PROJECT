<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Decks</title>
  <style>
    body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;
         display:flex;align-items:center;justify-content:center;}
    .container{width:min(700px,92vw);}
    h1{font-size:40px;margin-bottom:6px;}
    .actions{margin-bottom:28px;}
    .actions a{color:#8ab4ff;text-decoration:underline;font-size:18px;}
    ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;}
    li a{color:#8ab4ff;text-decoration:underline;font-size:20px;}
    .empty{font-size:18px;color:#aaa;}
    .back{margin-top:40px;}
    .back a{color:#8ab4ff;text-decoration:underline;font-size:16px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>My Decks</h1>
    <div class="actions">
      <a href="{{ url_for('flashcards.deck_create') }}">+ New Deck</a>
    </div>

    {% if decks %}
    <ul>
      {% for deck in decks %}
      <li><a href="#">{{ deck['title'] }}</a></li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">You have no decks yet. Create one above.</p>
    {% endif %}

    <div class="back">
      <a href="{{ url_for('flashcards.flashcards_menu') }}">← Back to Menu</a>
    </div>
  </div>
</body>
</html>
