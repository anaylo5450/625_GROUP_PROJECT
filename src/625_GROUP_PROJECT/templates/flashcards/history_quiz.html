<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question {{ n }} of {{ total }}</title>
  <style>
    body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;
         display:flex;align-items:center;justify-content:center;}
    .container{width:min(700px,92vw);}
    h2{font-size:28px;margin-bottom:8px;}
    .progress{font-size:16px;color:#aaa;margin-bottom:24px;}
    .question{font-size:22px;margin-bottom:28px;}
    .choices{display:flex;flex-direction:column;gap:14px;}
    .choices label{display:flex;align-items:center;gap:12px;font-size:20px;cursor:pointer;}
    .choices input[type=radio]{width:20px;height:20px;cursor:pointer;}
    button{margin-top:28px;padding:10px 28px;font-size:18px;background:#8ab4ff;
           color:#000;border:none;border-radius:4px;cursor:pointer;}
  </style>
</head>
<body>
  <div class="container">
    <h2>Sample History Quiz</h2>
    <p class="progress">Question {{ n }} of {{ total }}</p>
    <p class="question">{{ card.question }}</p>
    <form method="post">
      <div class="choices">
        {% for choice in card.choices %}
        <label>
          <input type="radio" name="pick" value="{{ loop.index0 }}" required>
          {{ choice }}
        </label>
        {% endfor %}
      </div>
      <button type="submit">Next →</button>
    </form>
  </div>
</body>
</html>
