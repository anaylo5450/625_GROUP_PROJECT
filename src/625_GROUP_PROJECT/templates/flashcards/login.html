<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;
         display:flex;align-items:center;justify-content:center;}
    .container{width:min(500px,92vw);}
    h1{font-size:36px;margin-bottom:24px;}
    label{display:block;font-size:16px;margin-bottom:4px;}
    input[type=text],input[type=password]{
      width:100%;box-sizing:border-box;padding:10px;font-size:16px;
      background:#111;color:#fff;border:1px solid #444;border-radius:4px;margin-bottom:16px;}
    button{padding:10px 24px;font-size:16px;background:#8ab4ff;color:#000;
           border:none;border-radius:4px;cursor:pointer;}
    a{color:#8ab4ff;text-decoration:underline;font-size:16px;}
    .foot{margin-top:20px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Login</h1>
    <form method="post">
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
    <p class="foot">No account? <a href="{{ url_for('flashcards.register') }}">Register</a></p>
  </div>
</body>
</html>
