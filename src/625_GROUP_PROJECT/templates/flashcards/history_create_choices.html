<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Choices</title>
  <style>
    body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;
         display:flex;align-items:center;justify-content:center;}
    .container{width:min(600px,92vw);}
    h1{font-size:36px;margin-bottom:6px;}
    .question-box{font-size:18px;background:#111;padding:14px;border-radius:4px;
                  margin-bottom:24px;border:1px solid #333;}
    label{display:block;font-size:16px;margin-bottom:4px;}
    input[type=text], input[type=file]{
      width:100%;box-sizing:border-box;padding:10px;font-size:16px;
      background:#111;color:#fff;border:1px solid #444;border-radius:4px;margin-bottom:14px;}
    .correct-label{font-size:16px;margin-bottom:8px;}
    .radio-group{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
    .radio-group label{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer;}
    button{padding:10px 24px;font-size:16px;background:#8ab4ff;color:#000;
           border:none;border-radius:4px;cursor:pointer;}
    a{color:#8ab4ff;text-decoration:underline;font-size:16px;display:block;margin-top:20px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Answer Choices</h1>
    <p class="question-box">{{ question }}</p>
    <form method="post" enctype="multipart/form-data">
      <label>Choice A</label>
      <input type="text" name="a1" required>

      <label>Choice B</label>
      <input type="text" name="a2" required>

      <label>Choice C</label>
      <input type="text" name="a3" required>

      <label>Choice D</label>
      <input type="text" name="a4" required>

      <label for="image">Flashcard Image (optional)</label>
      <input type="file" id="image" name="image" accept="image/*">

      <p class="correct-label">Which choice is correct?</p>
      <div class="radio-group">
        <label><input type="radio" name="correct" value="0" required> A</label>
        <label><input type="radio" name="correct" value="1"> B</label>
        <label><input type="radio" name="correct" value="2"> C</label>
        <label><input type="radio" name="correct" value="3"> D</label>
      </div>

      <button type="submit">Save Question</button>
    </form>
    <a href="{{ url_for('flashcards.history_create_question') }}">← Back</a>
  </div>
</body>
</html>
